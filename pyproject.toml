[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "exengine"
authors = [{name = "Henry Pinkard", email = "henry.pinkard.open.source@gmail.com"}, {name="Ivo Vellekoop"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent"
    ]
dependencies = [
    "pydantic",
    "numpy"
]
requires-python = ">=3.10"
version = "0.4.0"

dynamic = ["version"]
description = "Microscopy execution engine with support for multiple hardware backends"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest"]  

# all backends -- this should be the union of all the specific backends below
all = [
    "mmpycorex",
    "ndstorage",
    "openwfs",
    ]

# device backends
micromanager = ["mmpycorex"]
openwfs = ["openwfs"]

# storage backends
ndstorage = ["ndstorage"]

# documentation
docs = ["sphinx"]

[project.urls]
Home = "https://github.com/micro-manager/ExEngine"

